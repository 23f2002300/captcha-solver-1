<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Captcha Solver Demo</title><script src="https://cdn.tailwindcss.com"></script><style>body {font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";}</style></head><body class="bg-gray-900 flex items-center justify-center min-h-screen p-4"><div class="bg-gray-800 p-8 rounded-lg shadow-xl w-full max-w-md"><h1 class="text-3xl font-bold text-center text-gray-100 mb-6">Captcha Challenge</h1><div class="mb-6 text-center"><img id="captchaImage" src="sample.png" alt="Captcha Image" class="mx-auto border border-gray-700 bg-gray-900 p-2 rounded-md max-w-full h-auto"><p class="text-sm text-gray-400 mt-2">Can't see the image? <a href="#" onclick="reloadCaptcha()" class="text-blue-500 hover:underline">Reload</a></p></div><div class="mb-4"><label for="captchaInput" class="block text-gray-300 text-sm font-semibold mb-2">Enter the text from the image:</label><input type="text" id="captchaInput" class="shadow appearance-none border border-gray-600 rounded w-full py-2 px-3 text-gray-200 bg-gray-700 placeholder-gray-400 leading-tight focus:outline-none focus:shadow-outline focus:border-blue-500" placeholder="e.g., ADCRB"></div><button id="verifyButton" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded w-full focus:outline-none focus:shadow-outline transition duration-150 ease-in-out">Verify Captcha</button><div id="messageArea" class="mt-4 text-center text-sm font-medium"></div><p class="text-xs text-gray-400 text-center mt-6">Tip: You can load custom CAPTCHA images by adding `?url=https://example.com/image.png` to the URL.</p></div><script>const captchaImage = document.getElementById('captchaImage');const captchaInput = document.getElementById('captchaInput');const verifyButton = document.getElementById('verifyButton');const messageArea = document.getElementById('messageArea');const correctSolutionForSample = "ADCRB";function getQueryParam(name) {const urlParams = new URLSearchParams(window.location.search);return urlParams.get(name);}function loadCaptchaImage() {const imageUrl = getQueryParam('url');if (imageUrl) {captchaImage.src = imageUrl;captchaImage.onerror = () => {messageArea.className = 'mt-4 text-center text-sm font-medium text-red-600';messageArea.textContent = 'Failed to load image from URL. Using default.';captchaImage.src = 'sample.png';};} else {captchaImage.src = 'sample.png';}messageArea.textContent = '';captchaInput.value = '';captchaInput.focus();}function reloadCaptcha() {captchaImage.src += '?timestamp=' + new Date().getTime();loadCaptchaImage();}verifyButton.addEventListener('click', () => {const enteredText = captchaInput.value.trim().toUpperCase();const isDefaultSample = !getQueryParam('url');if (isDefaultSample) {if (enteredText === correctSolutionForSample) {messageArea.className = 'mt-4 text-center text-sm font-medium text-green-600';messageArea.textContent = 'Captcha verified successfully!';} else {messageArea.className = 'mt-4 text-center text-sm font-medium text-red-600';messageArea.textContent = 'Incorrect Captcha. Please try again.';}} else {if (enteredText) {messageArea.className = 'mt-4 text-center text-sm font-medium text-blue-600';messageArea.textContent = `Captcha "${enteredText}" submitted for external image.`;} else {messageArea.className = 'mt-4 text-center text-sm font-medium text-red-600';messageArea.textContent = 'Please enter the Captcha text.';}}});window.addEventListener('load', loadCaptchaImage);</script></body></html>
